<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>comp</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/button.css" />
    <link rel="stylesheet" href="css/trans.css" />
    <link rel="stylesheet" href="css/glow.css" />
  </head>
  <body>
    <div class="wrap">
      <input type="radio" name="h_menu" id="hbtn" checked />
      <input type="radio" name="h_menu" id="trans" />
      <input type="radio" name="h_menu" id="anime" />
      <header>
        <div class="h_inner">
          <label for="hbtn" class="anton-regular"
            >BUTTON
            <div class="ripple">
              <div></div>
              <div></div></div
          ></label>
          <label for="trans" class="anton-regular"
            >TRANSPARENT
            <div class="ripple">
              <div></div>
              <div></div></div
          ></label>
          <label for="anime" class="anton-regular"
            >GLOW
            <div class="ripple">
              <div></div>
              <div></div></div
          ></label>
        </div>
      </header>
      <section class="box_hbtn">
        <div class="box_inner">
          <div class="cards">
            <div class="card one">
              <p>HOVER</p>
            </div>
            <div class="card two">
              <p>AND</p>
            </div>
            <div class="card three">
              <p>FOCUS</p>
            </div>
          </div>
        </div>
      </section>
      <section class="box_trans">
        <div class="box_inner">
          <div class="box">
            <div class="inbox"></div>
            <div class="inbox"></div>
            <div class="inbox"></div>
          </div>
        </div>
      </section>
      <section class="box_glow">
        <div class="box_inner">
          <button class="gbtn">TRY<br />HOVER<br />AND<br />CLICK</button>
        </div>
      </section>
    </div>
  </body>
</html>
